<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'JetBrains Mono', ui-monospace, monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="20" fill="#161514"/>

  <!-- Row 1: two input sources -->
  <rect x="70" y="46" width="430" height="88" rx="12" fill="#1f1e1c" stroke="#3b3634" stroke-width="1.5"/>
  <text x="285" y="80" fill="#f2f0ed" font-size="19" font-weight="700" text-anchor="middle">Web — paste &amp; scan</text>
  <text x="285" y="106" fill="#9c9894" font-size="13" text-anchor="middle">claude_desktop_config.json / .cursor/mcp.json</text>

  <rect x="700" y="46" width="430" height="88" rx="12" fill="#1f1e1c" stroke="#3b3634" stroke-width="1.5"/>
  <text x="915" y="80" fill="#f2f0ed" font-size="19" font-weight="700" text-anchor="middle">CLI — offline Go binary</text>
  <text x="915" y="106" fill="#9c9894" font-size="13" text-anchor="middle">runs fully local, zero data sent by default</text>

  <line x1="285" y1="134" x2="285" y2="176" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="915" y1="134" x2="915" y2="176" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="285" y1="176" x2="915" y2="176" stroke="#3b82f6" stroke-width="2"/>
  <line x1="600" y1="176" x2="600" y2="196" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: parser -->
  <rect x="380" y="198" width="440" height="66" rx="12" fill="#1f1e1c" stroke="#3b3634" stroke-width="1.5"/>
  <text x="600" y="238" fill="#f2f0ed" font-size="17" font-weight="700" text-anchor="middle">JSONC-aware config parser</text>

  <line x1="600" y1="264" x2="600" y2="290" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3: engine — 54 checks across 11 modules -->
  <rect x="90" y="292" width="1020" height="220" rx="14" fill="#1a2233" stroke="#2c3d5c" stroke-width="1.5"/>
  <text x="600" y="324" fill="#7fb0ff" font-size="19" font-weight="700" text-anchor="middle">MCPAudit Engine — 54 checks across 11 modules</text>

  <!-- module chips -->
  <g font-size="12.5" fill="#dbe6fb">
    <rect x="112" y="344" width="150" height="34" rx="8" fill="#22314c"/>
    <text x="187" y="366" text-anchor="middle">Secrets (SEC)</text>

    <rect x="272" y="344" width="170" height="34" rx="8" fill="#22314c"/>
    <text x="357" y="366" text-anchor="middle">Supply Chain (SC)</text>

    <rect x="452" y="344" width="180" height="34" rx="8" fill="#22314c"/>
    <text x="542" y="366" text-anchor="middle">Privilege Escalation (PE)</text>

    <rect x="642" y="344" width="180" height="34" rx="8" fill="#22314c"/>
    <text x="732" y="366" text-anchor="middle">Tool Poisoning (PI/DX)</text>

    <rect x="832" y="344" width="176" height="34" rx="8" fill="#22314c"/>
    <text x="920" y="366" text-anchor="middle">Shadow Servers (SH)</text>

    <rect x="112" y="388" width="180" height="34" rx="8" fill="#22314c"/>
    <text x="202" y="410" text-anchor="middle">Code Execution (EX)</text>

    <rect x="302" y="388" width="200" height="34" rx="8" fill="#22314c"/>
    <text x="402" y="410" text-anchor="middle">Cross-Server Chains (CHAIN)</text>

    <rect x="512" y="388" width="190" height="34" rx="8" fill="#22314c"/>
    <text x="607" y="410" text-anchor="middle">Audit &amp; Telemetry (AT)</text>

    <rect x="712" y="388" width="150" height="34" rx="8" fill="#22314c"/>
    <text x="787" y="410" text-anchor="middle">Lifecycle (LF)</text>

    <rect x="872" y="388" width="136" height="34" rx="8" fill="#22314c"/>
    <text x="940" y="410" text-anchor="middle">Config-Level (CL)</text>
  </g>

  <text x="600" y="450" fill="#9cb4de" font-size="13" text-anchor="middle">+ live CVE lookup via OSV.dev, no API key required</text>

  <text x="600" y="486" fill="#7fb0ff" font-size="13.5" text-anchor="middle">every finding tagged with severity · OWASP MCP category · CWE ID · MITRE ATT&amp;CK tactic · fix guidance</text>

  <line x1="600" y1="512" x2="600" y2="538" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 4: outputs -->
  <rect x="90" y="540" width="310" height="70" rx="12" fill="#1f1e1c" stroke="#3b3634" stroke-width="1.5"/>
  <text x="245" y="581" fill="#f2f0ed" font-size="15.5" font-weight="700" text-anchor="middle">JSON report</text>

  <rect x="445" y="540" width="310" height="70" rx="12" fill="#1f1e1c" stroke="#3b3634" stroke-width="1.5"/>
  <text x="600" y="573" fill="#f2f0ed" font-size="15.5" font-weight="700" text-anchor="middle">SARIF 2.1.0</text>
  <text x="600" y="594" fill="#9c9894" font-size="12" text-anchor="middle">→ GitHub Security tab</text>

  <rect x="800" y="540" width="310" height="70" rx="12" fill="#1f1e1c" stroke="#3b3634" stroke-width="1.5"/>
  <text x="955" y="573" fill="#f2f0ed" font-size="15.5" font-weight="700" text-anchor="middle">CycloneDX AI-BOM</text>
  <text x="955" y="594" fill="#9c9894" font-size="12" text-anchor="middle">supply-chain / SBOM</text>

  <line x1="245" y1="512" x2="245" y2="540" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="512" x2="600" y2="540" stroke="#3b82f6" stroke-width="0"/>
  <line x1="600" y1="518" x2="600" y2="540" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="955" y1="512" x2="955" y2="540" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="600" y1="610" x2="600" y2="636" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 5: CI/CD gate -->
  <rect x="240" y="638" width="720" height="80" rx="12" fill="#331c1c" stroke="#5c2c2c" stroke-width="1.5"/>
  <text x="600" y="670" fill="#ff9d9d" font-size="17" font-weight="700" text-anchor="middle">GitHub Action — mcpaudit-security-scan</text>
  <text x="600" y="695" fill="#d8b3b3" font-size="12.5" text-anchor="middle">--fail-on critical/high/medium  →  blocks the PR merge if breached</text>
</svg>
